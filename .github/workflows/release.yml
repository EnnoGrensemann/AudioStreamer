name: Build & Release VinylCast APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (z.B. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.jks"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.jks" >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret found; using debug signing fallback."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            VERSION="${{ inputs.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          ./gradlew assembleRelease -PVERSION_NAME="$VERSION"

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "${{ github.workspace }}/VinylCast-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinylCast-APK
          path: ${{ github.workspace }}/VinylCast-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: "VinylCast ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/VinylCast-release.apk
